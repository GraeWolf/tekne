# Tekne (DEC-041), on top of NVIDIA's own /etc/modprobe.d/nvidia.conf, which
# already sets UseKernelSuspendNotifiers (suspend and hibernate without a
# hook), PreserveVideoMemoryAllocations, TemporaryFilePath=/var/tmp and S0ix,
# and blacklists nouveau.
# Power the GPU off when idle (runtime D3), whatever the driver's default.
options nvidia NVreg_DynamicPowerManagement=0x02
# Outputs wired to the NVIDIA GPU need it (reverse PRIME). The default since
# 560; set explicitly.
options nvidia-drm modeset=1
