# DEC-041 / Phase 17: drive nvidia-drm with XLibre's modesetting DDX.
# NVIDIA's proprietary DDX fails with "Failed to acquire modesetting
# permission" (rootless and root). First Driver entry wins, so this file
# sorts before 10-nvidia-*. tekne-nvidia also diverts NVIDIA snippets that
# would still set ModulePath for glxserver_nvidia on this device.
Section "OutputClass"
	Identifier "tekne-nvidia-modesetting"
	MatchDriver "nvidia-drm"
	Driver "modesetting"
EndSection
