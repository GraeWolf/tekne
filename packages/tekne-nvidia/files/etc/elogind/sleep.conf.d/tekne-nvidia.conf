# Tekne (DEC-041): no hybrid sleep with NVIDIA's driver.
#
# When a hibernation returns without a fresh boot, as a hybrid sleep does when
# it wakes from memory, or as one the kernel abandons does, NVIDIA's driver
# (615, kernel suspend notifiers) stays broken until the next power-off: every
# later suspend and hibernate fails, and reboot and poweroff hang. A plain
# hibernation powers off, so the driver starts fresh when it resumes.
#
# With hybrid sleep unavailable, UPower's critical-battery action falls back to
# a plain hibernation (DEC-017). Purging tekne-nvidia removes this file.
[Sleep]
AllowHybridSleep=no
