<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tekne (DEC-043): Nerd Fonts' symbols as a fallback right after the
     terminal font, so icons render in alacritty and other monospace text
     without changing the font's metrics. polybar names its fonts itself. -->
<fontconfig>
  <alias binding="weak">
    <family>JetBrains Mono</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
