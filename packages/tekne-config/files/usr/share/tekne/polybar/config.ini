; Tekne's default polybar, started from the herbstluftwm autostart.
; Colours: Tokyo Night (DEC-034). Icons: Nerd Fonts' symbols (DEC-043), font 3.

[colors]
background = #1a1b26
foreground = #c0caf5
primary = #7aa2f7
alert = #f7768e
disabled = #565f89

[bar/tekne]
width = 100%
height = 22pt
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}
font-0 = JetBrains Mono:size=10;2
font-1 = Noto Color Emoji:scale=10;2
font-2 = Symbols Nerd Font:size=12;3
modules-left = xworkspaces xwindow
modules-center = date
modules-right = pulseaudio wlan eth battery tray
cursor-click = pointer
enable-ipc = true

; All nine tags: active on the accent, occupied in the foreground colour,
; empty dimmed. Clicking a tag switches to it.
[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-font = 3
ramp-volume-foreground = ${colors.primary}
label-volume = %percentage%%
format-muted = <label-muted>
label-muted = 󰖁
label-muted-font = 3
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol &

; Clicking a network module opens nmtui (DEC-011: no tray applet), floating
; and centred (tekne-nmtui).
[network-base]
type = internal/network
interval = 5
format-connected = %{A1:tekne-nmtui &:}<label-connected>%{A}
format-disconnected = %{A1:tekne-nmtui &:}<label-disconnected>%{A}

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = %{A1:tekne-nmtui &:}<ramp-signal> <label-connected>%{A}
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = 3
ramp-signal-foreground = ${colors.primary}
label-connected = %essid%
label-disconnected = 󰤮
label-disconnected-font = 3
label-disconnected-foreground = ${colors.disabled}

[module/eth]
inherit = network-base
interface-type = wired
format-connected = %{A1:tekne-nmtui &:}<label-connected>%{A}
format-connected-prefix = "󰈀 "
format-connected-prefix-font = 3
format-connected-prefix-foreground = ${colors.primary}
label-connected = %local_ip%
; Hidden when unplugged (an empty label would still leave separators around it).
format-disconnected =

[module/battery]
type = internal/battery
; Detected by the herbstluftwm autostart; polybar's defaults as a fallback.
battery = ${env:TEKNE_BATTERY:BAT0}
adapter = ${env:TEKNE_ADAPTER:ADP1}
full-at = 99
low-at = 10
format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-font = 3
format-charging-prefix-foreground = ${colors.primary}
format-discharging = <ramp-capacity> <label-discharging>
format-full-prefix = "󰁹 "
format-full-prefix-font = 3
format-full-prefix-foreground = ${colors.primary}
format-low = <label-low>
format-low-prefix = "󱃍 "
format-low-prefix-font = 3
format-low-prefix-foreground = ${colors.alert}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
ramp-capacity-font = 3
ramp-capacity-foreground = ${colors.primary}
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 5
date = %a %d %b %H:%M
format-prefix = "󰅐 "
format-prefix-font = 3
format-prefix-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 4px

[settings]
screenchange-reload = true
