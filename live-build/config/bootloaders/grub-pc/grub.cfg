source /boot/grub/config.cfg

# Live boot. Tekne's own entries instead of the ones live-build generates,
# which are labelled "Live system" and include Debian's fail-safe options.
# (Don't name live-build's placeholder in a comment: it replaces any line that
# contains it with those entries.)
menuentry "Tekne live" --hotkey=l {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

# For graphics that don't come up (e.g. some hybrid NVIDIA laptops): the
# kernel's generic framebuffer instead of the GPU driver.
menuentry "Tekne live (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

# For installing where no desktop comes up at all (e.g. an NVIDIA-only
# desktop on nouveau): the generic framebuffer, and tekne.console keeps tty1
# on a console with a hint to run the installer (0162-tekne-console).
# tests/smoke/live-boot.py picks this entry as the second after "safe
# graphics" and edits it, so keep it in this place.
menuentry "Tekne live (console, no desktop)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset tekne.console
	initrd	@INITRD_LIVE@
}

# Automated tests (tests/smoke/) press "s" at this menu: kernel output goes
# to the serial port too, and tekne.serial starts a serial login prompt.
menuentry "Tekne live (serial console)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ console=tty0 console=ttyS0,115200n8 tekne.serial
	initrd	@INITRD_LIVE@
}

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi
}
