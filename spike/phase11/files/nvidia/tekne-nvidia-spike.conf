# Phase 11 spike, option 3 (DEC-041). NVIDIA's own /etc/modprobe.d/nvidia.conf
# already sets UseKernelSuspendNotifiers, PreserveVideoMemoryAllocations,
# TemporaryFilePath=/var/tmp and S0ix, and blacklists nouveau.
# Power the GPU off when idle (runtime D3), whatever the default.
options nvidia NVreg_DynamicPowerManagement=0x02
# Outputs wired to the NVIDIA GPU (HDMI) need it (reverse PRIME); already the
# default since 560, set explicitly.
options nvidia-drm modeset=1
