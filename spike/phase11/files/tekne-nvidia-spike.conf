# Phase 11 spike (DEC-041). Debian renames the modules: nvidia -> nvidia-current.
# Keep video memory across suspend and hibernate (needs the elogind sleep hook),
# saved to disk rather than tmpfs; power the GPU off when idle (runtime D3).
options nvidia-current NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_DynamicPowerManagement=0x02
# Needed for outputs wired to the NVIDIA GPU (reverse PRIME).
options nvidia-current-drm modeset=1
